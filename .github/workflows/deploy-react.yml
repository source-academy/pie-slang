name: Deploy React App to Pie Playground

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: web-react
        run: npm install

      - name: Build React App
        working-directory: web-react
        # Both models go through the Cloudflare Worker in proxy/, which holds
        # the keys; no key is baked into the public bundle.
        env:
          VITE_LORA_SERVER_URL: https://rapid-mud-6dea.e1264831.workers.dev
          VITE_GENERAL_LLM_PROXY_URL: https://rapid-mud-6dea.e1264831.workers.dev
        run: npx vite build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-react/dist
          publish_branch: gh-pages
          destination_dir: pie-playground
          commit_message: "Deploy web-react from ai-visual"
